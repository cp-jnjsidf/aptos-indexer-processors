x-indexer: &indexer-base
  image: oct8
  restart: always
  volumes:
    - ./config/config_user_transcations_new.yaml:/app/config/config.yaml
  networks:
    - aptos-network
    - default
  logging:
    driver: "json-file"
    options:
      max-size: "1m"
      max-file: "3"

  deploy:
    resources:
      limits:
        cpus: "6"
        memory: "25g"

  command: ["--config-path", "/app/config/config.yaml"]

